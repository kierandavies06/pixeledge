name: Release

# Push a tag like v1.0.0 to build signed APKs and attach them to a GitHub release.
# Needs these repository secrets: KEYSTORE_BASE64 (base64 of your .jks/.keystore), KS_PASS, KEY_ALIAS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            .toolchain
            libs
          key: toolchain-${{ hashFiles('scripts/setup.sh') }}

      - name: Set up toolchain
        run: scripts/setup.sh

      - name: Build and sign
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE="$RUNNER_TEMP/release.keystore"
          export VERSION="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${GITHUB_RUN_NUMBER}"
          ./build.sh app
          ./build.sh watch
          cp build/app/edgelight.apk edge-light-phone.apk
          cp build/watch/edgelight.apk edge-light-watch.apk
          sha256sum edge-light-*.apk > SHA256SUMS
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes edge-light-phone.apk edge-light-watch.apk SHA256SUMS
